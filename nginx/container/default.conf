server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml font/woff font/woff2;

    # Next.js build assets are content-hashed and never change
    location /_next/static/ {
        include /etc/nginx/conf.d/security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images, icons and fonts
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2)$ {
        include /etc/nginx/conf.d/security.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    # Pages: every route is exported as <route>/index.html. HTML is always revalidated.
    location / {
        include /etc/nginx/conf.d/security.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    # Unknown URLs get the site's 404 page (with a real 404 status)
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Health check endpoint
    location = /health.html {
        add_header Content-Type text/html;
        add_header Cache-Control "no-store";
        return 200 'OK';
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
