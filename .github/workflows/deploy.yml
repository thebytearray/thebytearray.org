# Builds the site and publishes it to the server on every push to main.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST             server address
#   VPS_USER             a user that can write <site-dir>
#   VPS_SSH_PRIVATE_KEY  private key of a keypair that user accepts
#   VPS_KNOWN_HOSTS      the server's host keys (`ssh-keyscan <address>`)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Verify and deploy to production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Builds, uploads the release, switches to it, reads it back from the
      # server's own nginx and rolls back if it is not being served.
      - name: Build and publish
        env:
          DEPLOY_HOST: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          DEPLOY_KEY: /home/runner/.ssh/deploy_key
        run: bash deploy/deploy.sh
