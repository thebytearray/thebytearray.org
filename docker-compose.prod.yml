# Production compose override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    build:
      args:
        - NODE_ENV=production
    # Keep the ${IMAGE_TAG} indirection: a hardcoded tag here would override the
    # base file and break per-commit deploys and rollback to a previous image.
    image: thebytearray/website:${IMAGE_TAG:-latest}
    restart: always

  edge:
    restart: always
